<section class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <div class="eyebrow">{{ site.tagline }}</div>
      <h1 class="hero-title">
          We build
          <strong>the <span class="g">ideas</span></strong>
          that define<br/>
          <strong>the <span class="g-alt">future</span></strong>
      </h1>
      <p class="hero-body">
        From cutting-edge AI research to life-changing software solutions,
        {{ site.brand }} builds the future that we want to see.
      </p>
      <div class="hero-actions">
        <a [routerLink]="[]" fragment="services" class="btn-glow-ex">See What We Do</a>
        <a routerLink="/who-we-are" class="btn-glow">See Who We Are</a>
        <a [routerLink]="[]" fragment="contact" class="btn-outline">Get in Touch</a>
      </div>
    </div>

    <div class="hero-visual">
      <div class="orb-wrap">
        <div class="orb-halo"></div>
        <div class="orb-ring rb"></div>
        <div class="orb-ring ra"></div>
        <div class="orb-core">
          <!--<img src="/images/OpenLogo.svg" alt="ST"/> -->
          <div class="gradient-logo-closed"></div>
        </div>
        <div class="orb-ring rc"></div>
      </div>
    </div>
  </div>
</section>
